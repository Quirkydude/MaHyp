<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5CE1E6"/>
      <stop offset="100%" stop-color="#009EAA"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#009EAA" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background circle with gradient -->
  <circle cx="100" cy="100" r="92" fill="url(#bgGradient)"/>

  <!-- Subtle inner ring -->
  <circle cx="100" cy="100" r="84" stroke="white" stroke-width="1.5" fill="none" opacity="0.2"/>

  <!-- Heart shape -->
  <path
    d="M100 152 C100 152, 60 126, 49 102 C38 78, 40 60, 53 51 C66 42, 83 46, 92 58 C96 63, 98 67, 100 71 C102 67, 104 63, 108 58 C117 46, 134 42, 147 51 C160 60, 162 78, 151 102 C140 126, 100 152, 100 152 Z"
    fill="white"
    filter="url(#shadow)"
  />

  <!-- ECG / Pulse line — dark turquoise on white heart, seamlessly continues -->
  <path
    d="M 38 100 L 66 100 L 77 80 L 88 122 L 98 90 L 109 110 L 119 100 L 162 100"
    stroke="#00C9D6"
    stroke-width="4.5"
    fill="none"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Pulse line segments on turquoise background — white overlay for readability -->
  <path
    d="M 38 100 L 66 100"
    stroke="white"
    stroke-width="4.5"
    fill="none"
    stroke-linecap="round"
    opacity="0.9"
  />
  <path
    d="M 119 100 L 162 100"
    stroke="white"
    stroke-width="4.5"
    fill="none"
    stroke-linecap="round"
    opacity="0.9"
  />
</svg>
