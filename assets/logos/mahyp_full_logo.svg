<?xml version="1.0" encoding="UTF-8"?>
<!--
  mahyp_full_logo.svg — horizontal lockup: icon + wordmark + tagline
  Dimensions: 420 x 120
-->
<svg width="420" height="120" viewBox="0 0 420 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5CE1E6"/>
      <stop offset="100%" stop-color="#009EAA"/>
    </linearGradient>
    <filter id="iconShadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#009EAA" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- ── Icon (60×60, centered vertically at x=10, y=30) ── -->
  <g transform="translate(10, 30)">
    <!-- Background circle -->
    <circle cx="30" cy="30" r="28" fill="url(#iconBg)"/>
    <!-- Inner ring -->
    <circle cx="30" cy="30" r="25" stroke="white" stroke-width="1" fill="none" opacity="0.2"/>
    <!-- Heart shape -->
    <path
      d="M30 46 C30 46, 17 37, 13 29 C9 21, 10 15, 15 12 C20 9, 26 11, 29 15 C29.5 16 30 17 30 18 C30 17 30.5 16 31 15 C34 11, 40 9, 45 12 C50 15, 51 21, 47 29 C43 37, 30 46, 30 46 Z"
      fill="white"
      filter="url(#iconShadow)"
    />
    <!-- ECG line — turquoise on white heart, white on teal bg -->
    <path
      d="M 8 29 L 18 29 L 21 23 L 25 36 L 28 25 L 32 32 L 35 29 L 52 29"
      stroke="#00C9D6"
      stroke-width="2"
      fill="none"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path d="M 8 29 L 18 29" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.9"/>
    <path d="M 35 29 L 52 29" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- ── Wordmark: "MaHyp" ── -->
  <text
    x="86"
    y="58"
    font-family="'SF Pro Display', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="38"
    font-weight="700"
    letter-spacing="-0.5"
    fill="#00C9D6"
  >MaHyp</text>

  <!-- ── Tagline ── -->
  <text
    x="88"
    y="80"
    font-family="'SF Pro Text', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="13"
    font-weight="400"
    letter-spacing="0.3"
    fill="#6B7280"
  >My Hypertension Monitor</text>
</svg>
