<?xml version="1.0" encoding="UTF-8"?>
<!--
  mahyp_icon.svg — monochrome white version for use on colored/gradient backgrounds
  (notification icons, overlays, splash screens, etc.)
-->
<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">

  <!-- Subtle outer ring -->
  <circle cx="100" cy="100" r="88" stroke="white" stroke-width="2" fill="none" opacity="0.25"/>

  <!-- Heart shape -->
  <path
    d="M100 152 C100 152, 60 126, 49 102 C38 78, 40 60, 53 51 C66 42, 83 46, 92 58 C96 63, 98 67, 100 71 C102 67, 104 63, 108 58 C117 46, 134 42, 147 51 C160 60, 162 78, 151 102 C140 126, 100 152, 100 152 Z"
    fill="white"
    opacity="0.95"
  />

  <!-- ECG / Pulse line — slightly transparent to contrast with white heart -->
  <!-- Segments inside the heart use a semi-transparent darker tone -->
  <path
    d="M 38 100 L 66 100 L 77 80 L 88 122 L 98 90 L 109 110 L 119 100 L 162 100"
    stroke="white"
    stroke-width="4.5"
    fill="none"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.4"
  />

  <!-- ECG segments outside heart — full white for visibility -->
  <path d="M 38 100 L 66 100" stroke="white" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <path d="M 119 100 L 162 100" stroke="white" stroke-width="4.5" fill="none" stroke-linecap="round"/>

  <!-- Small accent dot at top of heart -->
  <circle cx="100" cy="71" r="5" fill="white" opacity="0.6"/>
</svg>
