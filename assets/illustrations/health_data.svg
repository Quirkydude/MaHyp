<svg viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="150" cy="150" r="140" fill="#F0FDFF"/>
  
  <!-- Tablet/Screen -->
  <rect x="60" y="60" width="180" height="180" rx="12" fill="white" stroke="#00C9D6" stroke-width="3"/>
  
  <!-- Chart Bars -->
  <g>
    <!-- Bar 1 -->
    <rect x="80" y="160" width="25" height="60" rx="4" fill="#5CE1E6"/>
    
    <!-- Bar 2 -->
    <rect x="115" y="140" width="25" height="80" rx="4" fill="#00C9D6"/>
    
    <!-- Bar 3 -->
    <rect x="150" y="120" width="25" height="100" rx="4" fill="#00C9D6"/>
    
    <!-- Bar 4 -->
    <rect x="185" y="150" width="25" height="70" rx="4" fill="#5CE1E6"/>
  </g>
  
  <!-- Trend Line -->
  <path d="M 92.5 175 L 127.5 155 L 162.5 135 L 197.5 165" stroke="#dc2626" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Data Points -->
  <circle cx="92.5" cy="175" r="5" fill="white" stroke="#dc2626" stroke-width="2.5"/>
  <circle cx="127.5" cy="155" r="5" fill="white" stroke="#dc2626" stroke-width="2.5"/>
  <circle cx="162.5" cy="135" r="5" fill="white" stroke="#dc2626" stroke-width="2.5"/>
  <circle cx="197.5" cy="165" r="5" fill="white" stroke="#dc2626" stroke-width="2.5"/>
  
  <!-- Stats Cards -->
  <g>
    <!-- Card 1 -->
    <rect x="70" y="75" width="70" height="35" rx="6" fill="#F0FDFF"/>
    <text x="105" y="92" text-anchor="middle" fill="#00C9D6" font-size="11" font-weight="600" font-family="system-ui">AVG BP</text>
    <text x="105" y="104" text-anchor="middle" fill="#1F2937" font-size="14" font-weight="bold" font-family="system-ui">118/78</text>
    
    <!-- Card 2 -->
    <rect x="150" y="75" width="70" height="35" rx="6" fill="#FFF5F5"/>
    <text x="185" y="92" text-anchor="middle" fill="#dc2626" font-size="11" font-weight="600" font-family="system-ui">HEART</text>
    <text x="185" y="104" text-anchor="middle" fill="#1F2937" font-size="14" font-weight="bold" font-family="system-ui">72 BPM</text>
  </g>
  
  <!-- Grid Lines -->
  <line x1="75" y1="220" x2="215" y2="220" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="75" y1="190" x2="215" y2="190" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="75" y1="160" x2="215" y2="160" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="75" y1="130" x2="215" y2="130" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4 4"/>
  
  <!-- Heart Icon -->
  <g transform="translate(205, 205)">
    <path d="M 15 25 C 15 25, 7.5 18.75, 5 13.75 C 2.5 8.75, 2.5 5, 5 2.5 C 7.5 0, 12.5 0, 15 2.5 C 17.5 0, 22.5 0, 25 2.5 C 27.5 5, 27.5 8.75, 25 13.75 C 22.5 18.75, 15 25, 15 25 Z" fill="#dc2626"/>
  </g>
</svg>
