# Codemagic — MaHyp release APK (no upload keystore required)
#
# Builds a release APK signed with the debug key (fine for sideload / GitHub releases).
# Optional env var in Codemagic:
#   MOOLRE_VAS_KEY  — Moolre SMS VAS key (Secure)

workflows:
  android-release-apk:
    name: MaHyp Android Release APK
    max_build_duration: 45
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      java: 21
      vars:
        MOOLRE_SENDER_ID: KamarTec

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true

    scripts:
      - name: Install dependencies
        script: flutter pub get

      - name: Build release APK
        script: |
          flutter build apk --release \
            --dart-define=MOOLRE_VAS_KEY="${MOOLRE_VAS_KEY:-}" \
            --dart-define=MOOLRE_SENDER_ID="${MOOLRE_SENDER_ID:-KamarTec}"

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
