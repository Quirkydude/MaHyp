<svg viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="150" cy="150" r="140" fill="#F0FDFF"/>
  
  <!-- Calendar -->
  <g>
    <!-- Calendar Body -->
    <rect x="70" y="80" width="160" height="160" rx="12" fill="white" stroke="#00C9D6" stroke-width="3"/>
    
    <!-- Calendar Header -->
    <rect x="70" y="80" width="160" height="45" rx="12" fill="#00C9D6"/>
    <rect x="70" y="113" width="160" height="12" fill="#00C9D6"/>
    
    <!-- Binding Rings -->
    <circle cx="100" cy="80" r="8" fill="white" stroke="#00C9D6" stroke-width="2"/>
    <circle cx="150" cy="80" r="8" fill="white" stroke="#00C9D6" stroke-width="2"/>
    <circle cx="200" cy="80" r="8" fill="white" stroke="#00C9D6" stroke-width="2"/>
    
    <!-- Month/Year Text -->
    <text x="150" y="108" text-anchor="middle" fill="white" font-size="16" font-weight="bold" font-family="system-ui">March 2026</text>
    
    <!-- Week Day Headers -->
    <g fill="#9CA3AF" font-size="10" font-weight="600" font-family="system-ui">
      <text x="90" y="145" text-anchor="middle">S</text>
      <text x="110" y="145" text-anchor="middle">M</text>
      <text x="130" y="145" text-anchor="middle">T</text>
      <text x="150" y="145" text-anchor="middle">W</text>
      <text x="170" y="145" text-anchor="middle">T</text>
      <text x="190" y="145" text-anchor="middle">F</text>
      <text x="210" y="145" text-anchor="middle">S</text>
    </g>
    
    <!-- Calendar Dates -->
    <g fill="#374151" font-size="12" font-weight="500" font-family="system-ui">
      <!-- Week 1 -->
      <text x="90" y="168" text-anchor="middle" opacity="0.3">1</text>
      <text x="110" y="168" text-anchor="middle">2</text>
      <text x="130" y="168" text-anchor="middle">3</text>
      <text x="150" y="168" text-anchor="middle">4</text>
      <text x="170" y="168" text-anchor="middle">5</text>
      <text x="190" y="168" text-anchor="middle">6</text>
      <text x="210" y="168" text-anchor="middle">7</text>
      
      <!-- Week 2 -->
      <text x="90" y="190" text-anchor="middle">8</text>
      <text x="110" y="190" text-anchor="middle">9</text>
      <text x="130" y="190" text-anchor="middle">10</text>
      <text x="150" y="190" text-anchor="middle">11</text>
      <text x="170" y="190" text-anchor="middle">12</text>
      <text x="190" y="190" text-anchor="middle">13</text>
      <text x="210" y="190" text-anchor="middle">14</text>
      
      <!-- Week 3 -->
      <text x="90" y="212" text-anchor="middle">15</text>
      <text x="110" y="212" text-anchor="middle">16</text>
      <text x="130" y="212" text-anchor="middle">17</text>
      <text x="150" y="212" text-anchor="middle">18</text>
      <text x="170" y="212" text-anchor="middle">19</text>
      <text x="190" y="212" text-anchor="middle">20</text>
      <text x="210" y="212" text-anchor="middle">21</text>
    </g>
    
    <!-- Today Highlight (21st) -->
    <circle cx="210" cy="208" r="14" fill="#dc2626"/>
    <text x="210" y="212" text-anchor="middle" fill="white" font-size="12" font-weight="bold" font-family="system-ui">21</text>
    
    <!-- Appointment Dots -->
    <circle cx="130" cy="173" r="3" fill="#10B981"/>
    <circle cx="150" cy="173" r="3" fill="#00C9D6"/>
    <circle cx="110" cy="195" r="3" fill="#dc2626"/>
    <circle cx="170" cy="195" r="3" fill="#00C9D6"/>
  </g>
  
  <!-- Bell/Reminder Icon -->
  <g transform="translate(200, 40)">
    <path d="M 15 5 Q 15 0, 20 0 Q 25 0, 25 5 L 25 15 Q 25 22, 32 25 L 8 25 Q 15 22, 15 15 Z" fill="#dc2626"/>
    <ellipse cx="20" cy="27" rx="4" ry="3" fill="#dc2626"/>
    
    <!-- Bell Ring Animation -->
    <path d="M 10 8 Q 8 8, 6 6" stroke="#dc2626" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 30 8 Q 32 8, 34 6" stroke="#dc2626" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>
  
  <!-- Medication Icons on Calendar -->
  <g transform="translate(162, 183)">
    <ellipse cx="0" cy="0" rx="6" ry="4" fill="#00C9D6" transform="rotate(30)"/>
    <line x1="-4" y1="-2" x2="4" y2="2" stroke="white" stroke-width="1"/>
  </g>
  
  <!-- Time Indicator -->
  <g transform="translate(85, 215)">
    <circle cx="0" cy="0" r="12" fill="#5CE1E6"/>
    <line x1="0" y1="0" x2="0" y2="-6" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="4" y2="0" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
