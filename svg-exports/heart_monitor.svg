    <path d="M 25 45 C 25 45, 10 32.5, 5 22.5 C 0 12.5, 0 5, 5 0 C 10 -5, 17.5 -5, 22.5 0 C 24 1.5, 24.5 2.5, 25 4 C 25.5 2.5, 26 1.5, 27.5 0 C 32.5 -5, 40 -5, 45 0 C 50 5, 50 12.5, 45 22.5 C 40 32.5, 25 45, 25 45 Z" fill="#00C9D6"/>
