  <path d="M 75 140 L 100 140 L 110 110 L 125 170 L 140 130 L 155 150 L 165 140 L 225 140" stroke="#dc2626" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
