<svg viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="150" cy="150" r="140" fill="#F9FAFB"/>
  
  <!-- Empty Document/Clipboard -->
  <g>
    <!-- Clipboard -->
    <rect x="90" y="70" width="120" height="160" rx="8" fill="white" stroke="#D1D5DB" stroke-width="3" stroke-dasharray="8 4"/>
    
    <!-- Clipboard Clip -->
    <rect x="125" y="60" width="50" height="20" rx="6" fill="#E5E7EB"/>
    <rect x="130" y="65" width="40" height="10" rx="3" fill="white"/>
    
    <!-- Empty Lines (dashed) -->
    <line x1="110" y1="110" x2="190" y2="110" stroke="#D1D5DB" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
    <line x1="110" y1="130" x2="180" y2="130" stroke="#D1D5DB" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
    <line x1="110" y1="150" x2="185" y2="150" stroke="#D1D5DB" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
    <line x1="110" y1="170" x2="170" y2="170" stroke="#D1D5DB" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
  </g>
  
  <!-- Large Heart Icon (faded) -->
  <g transform="translate(125, 155)" opacity="0.2">
    <path d="M 25 45 C 25 45, 10 32.5, 5 22.5 C 0 12.5, 0 5, 5 0 C 10 -5, 17.5 -5, 22.5 0 C 24 1.5, 24.5 2.5, 25 4 C 25.5 2.5, 26 1.5, 27.5 0 C 32.5 -5, 40 -5, 45 0 C 50 5, 50 12.5, 45 22.5 C 40 32.5, 25 45, 25 45 Z" fill="#00C9D6"/>
  </g>
  
  <!-- Magnifying Glass -->
  <g transform="translate(170, 180)">
    <circle cx="20" cy="20" r="18" stroke="#9CA3AF" stroke-width="3" fill="none"/>
    <line x1="32" y1="32" x2="45" y2="45" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Floating Plus Signs -->
  <g opacity="0.4">
    <g transform="translate(70, 100)">
      <rect x="-1.5" y="-8" width="3" height="16" rx="1.5" fill="#00C9D6"/>
      <rect x="-8" y="-1.5" width="16" height="3" rx="1.5" fill="#00C9D6"/>
    </g>
    
    <g transform="translate(220, 120)">
      <rect x="-1" y="-6" width="2" height="12" rx="1" fill="#5CE1E6"/>
      <rect x="-6" y="-1" width="12" height="2" rx="1" fill="#5CE1E6"/>
    </g>
  </g>
  
  <!-- Small Dots Pattern -->
  <g opacity="0.15">
    <circle cx="80" cy="190" r="3" fill="#00C9D6"/>
    <circle cx="95" cy="205" r="3" fill="#00C9D6"/>
    <circle cx="220" cy="180" r="3" fill="#5CE1E6"/>
    <circle cx="210" cy="200" r="3" fill="#5CE1E6"/>
  </g>
</svg>
