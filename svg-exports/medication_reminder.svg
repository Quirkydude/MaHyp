<svg viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="150" cy="150" r="140" fill="#FFF5F5"/>
  
  <!-- Pill Bottle -->
  <g>
    <!-- Bottle Body -->
    <rect x="100" y="110" width="100" height="120" rx="8" fill="white" stroke="#00C9D6" stroke-width="3"/>
    <rect x="100" y="110" width="100" height="40" rx="8" fill="#5CE1E6"/>
    
    <!-- Label -->
    <rect x="110" y="160" width="80" height="50" rx="4" fill="#F0FDFF"/>
    <line x1="120" y1="175" x2="180" y2="175" stroke="#00C9D6" stroke-width="2" stroke-linecap="round"/>
    <line x1="120" y1="185" x2="170" y2="185" stroke="#00C9D6" stroke-width="2" stroke-linecap="round"/>
    <line x1="120" y1="195" x2="160" y2="195" stroke="#00C9D6" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Cap -->
    <rect x="110" y="85" width="80" height="30" rx="6" fill="#00A5B0"/>
    <rect x="115" y="90" width="70" height="5" rx="2" fill="#5CE1E6"/>
  </g>
  
  <!-- Pills -->
  <g>
    <!-- Pill 1 -->
    <ellipse cx="220" cy="170" rx="18" ry="10" fill="#dc2626" transform="rotate(30 220 170)"/>
    <line x1="208" y1="162" x2="232" y2="178" stroke="white" stroke-width="2"/>
    
    <!-- Pill 2 -->
    <ellipse cx="230" cy="210" rx="18" ry="10" fill="#00C9D6" transform="rotate(-20 230 210)"/>
    <line x1="218" y1="217" x2="242" y2="203" stroke="white" stroke-width="2"/>
    
    <!-- Pill 3 -->
    <circle cx="80" cy="190" r="12" fill="#10B981"/>
    <circle cx="80" cy="190" r="6" fill="white"/>
  </g>
  
  <!-- Clock/Alarm Icon -->
  <g transform="translate(50, 95)">
    <circle cx="30" cy="30" r="25" fill="#dc2626"/>
    <circle cx="30" cy="30" r="20" fill="white"/>
    
    <!-- Clock Hands -->
    <line x1="30" y1="30" x2="30" y2="18" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="30" y1="30" x2="38" y2="30" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="30" cy="30" r="2" fill="#dc2626"/>
    
    <!-- Bell Decoration -->
    <circle cx="22" cy="12" r="3" fill="#dc2626"/>
    <circle cx="38" cy="12" r="3" fill="#dc2626"/>
  </g>
  
  <!-- Notification Badge -->
  <circle cx="185" cy="95" r="12" fill="#dc2626"/>
  <text x="185" y="100" text-anchor="middle" fill="white" font-size="14" font-weight="bold" font-family="system-ui">3</text>
</svg>
